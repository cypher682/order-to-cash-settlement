services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o2c
      POSTGRES_PASSWORD: o2c
      POSTGRES_DB: o2c
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o2c -d o2c"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - o2c-postgres:/var/lib/postgresql/data

volumes:
  o2c-postgres:
